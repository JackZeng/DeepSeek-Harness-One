name: Bootstrap Canonical UI

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-ui.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact UI assets
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/ui.*.b64 | base64 -d > /tmp/ui-assets.tar.gz
          tar -xzf /tmp/ui-assets.tar.gz
          test "$(git hash-object public/app.css)" = "0884509b46c4ef6fc4b99d2204c164e718571423"
          test "$(git hash-object public/app.js)" = "ba8250601607e0505c60096030cc2b4226e3be48"
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore canonical UI assets"
          git push
